<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up | Pitchside</title>
  </head>
  <body>
    <header>
      <h1><a href="index.html">Pitchside</a></h1>
    </header>

    <main>
      <h2>Create an account</h2>
      <form action="Pitchside/signup" method="POST">
        <p>
          <label for="name">Name</label><br />
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
            maxlength="60"
          />
        </p>
        <p>
          <label for="email">Email</label><br />
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </p>
        <p>
          <label for="password">Password</label><br />
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </p>
        <p>
          <label
            ><input type="checkbox" name="terms" required /> I agree to the
            <a href="#terms.html">terms</a> and
            <a href="#privacy.html">privacy policy</a>.</label
          >
        </p>
        <button type="submit">Sign up</button>
      </form>
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </main>
  </body>
</html>
